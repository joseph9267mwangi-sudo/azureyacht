<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>luxury yatch
         rentals</title>
    <style>
        * {
            margin: 0;
            padding: 0;
            box-sizing: border-box;
            font-family: 'Helvetical neue',Arial, Helvetica, sans-serif;
        }
        body{
            background-color: #111;
            color: #fff;
            overflow-x: hidden;
        }
        /*hero section containers */
        .hero{
            position: relative;
            height: 100vh;
            width: 100%;
            /*high quality of placeholder image of a luxury yacht on blue water*/
            background-size: cover;
            background-position: center;
            display: flex;
            align-items: center;
            justify-content: flex-start;
            padding-left: 8%;
        }
        /*dark premium overlay to match the image vibe and make text pop */
        .hero::before {
            content: '';
            position: absolute;
            top: 0;
            left: 0;
            width: 100%;
            height: 100%;
            background: linear-gradient(72deg,rgba,(0,0,0,0.75));
            z-index: 1;
        }
        .hero-content {
            position: relative;
            z-index: 2;
            max-width: 650px;
        }
        .hero-content .subtitle{
            font-style: italic;
            font-size: 1.4rem;
            margin-bottom: 12px;
            color: #dcdcdc;
            font-family: georgia,serif;
        }
        .hero-content h1{
            font-size: 3.8rem;
            font-weight: 700;
            line-height: 1.15;
            margin-bottom: 22px;
            letter-spacing: -0.5px;
        }
        .hero-content p.desc{
            font-size: 1.15;
            line-height: 1.6;
            margin-bottom: 35px;
        }
        /*premium Border Button*/
        .btn-book{
            display: inline-block;
            padding: 14px 40px;
            border: 2px solid #fff;
            color: #fff;
            text-decoration: none;
            font-weight: 600;
            text-transform: uppercase;
            font-size: 0.85rem;
            letter-spacing: 1.5px;
            transition: all 0.3s ease;
        }
        .btn-book:hover {
            background-color: #fff;
            color: #000;
        }



    </style>
</head>
<body>
    <section class="hero">
        <div class="hero-content">
            <p class="subtitle"Let`s Make It a Best Day></p>
            <h1>The Best <br>luxury Yacht </h1>
            <p class="desc">We provide charter professionals with an exclusive,luxurious yacht experience and stunnimg waterway views and personalized amenities</p>
            <a href="#" class="btn-book">Book Now</a>
        </div>
        
    </body>
    </html>
