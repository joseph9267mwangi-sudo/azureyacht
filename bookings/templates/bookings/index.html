<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width= , initial-scale=1.0">
    <title>Luxury Yacht Rentals</title>
    <style>
        body {margin: 0;background: #0a1628;color: white; font-family: Arial,sans-serif;}
        .hero {background: linear-gradient(135deg,#0a1628,#0d3b6e);min-height: 60vh;display: flex;}
        h1 {font-size: 52px;color: white;margin-bottom: 16px;}
        .hero p {font-size: 16px;color: #aaa;max-width: 480px;}
        booking {padding: 60px 40px;}
        h2 {color: #c9a84c;font-size: 36px;margin-bottom: 30px; }
        input, select, textarea {
            display: block;width: 100%;padding: 12px;
            margin-bottom: 16px;background: #ffffff10;
            border: 1px solid #555;color: white;
            font-size: 14px;box-sizing: border-box;
        }
        select {background: #0d2040; }
        button {
            background: #c9a84c;color: #0a1628;
            padding: 14px 40px;border: none;
            font-size: 14px;font-weight: bold;cursor: pointer;
        }
    </style>
</head>
<body>

<div class="booking" id="booking">
    <h2>Book Your Yacht</h2>
    <form method="POST" action="/">
        {% csrf_token %}
        <input type="text" name="first_name" placeholder="First Name" required>
        <input type="text" name="last_name" placeholder="Last Name" required>
        <input type="email" name="email" placeholder="Email" required>
        <input type="tel" name="phone" placeholder="phone" required>
        <select name="yacht">
            <option value="poseidon">The poseidon 65ft</option>
            <option value="Azura">The Azura Prestige 82ft</option>
            <option value="Oceanus">The Oceanus 110ft</option>
        </select>
        <input type="number" name="guests" placeholder="Number of Guests" required>
        <input type="date" name="date" required>
        <select name="duration">
            <option value="4 Hours">4 hours</option>
            <option value="6 Hours">6 Hours</option>
            <option value="Full Day"></option>
            <option value="Overnight"></option>                                        
        </select>
        <textarea name="message" placeholder="Special request" id=""></textarea>
        <button type="submit">Book Now</button>
    </form>
</div>
    
</body>

</html>
